[custom]
; wirgurad ipv6免流，特殊地址直连

; === 基础规则 ===

ruleset=DIRECT,https://raw.githubusercontent.com/Edfon12138/clash-rules/refs/heads/main/ipv6%E7%9B%B4%E8%BF%9E.list
ruleset=Wireguard,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list  



ruleset=DIRECT,[]FINAL



; === 代理分组设置 ===
;custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇺🇸 美国节点

custom_proxy_group=Wireguard`select`[]DIRECT`.*




enable_rule_generator=true
overwrite_original_rules=true
